
name: Generar Reel

on:
  workflow_dispatch:
    inputs:
      frase1:
        description: "Primera frase"
        required: true
        default: "Cada caída enseña"
      frase2:
        description: "Segunda frase"
        required: true
        default: "Cada esfuerzo transforma"
      frase3:
        description: "Tercera frase"
        required: true
        default: "Cada amanecer renueva"

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Generar video MP4
        env:
          FRASE1: ${{ inputs.frase1 }}
          FRASE2: ${{ inputs.frase2 }}
          FRASE3: ${{ inputs.frase3 }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import textwrap

          frases = [
              os.environ["FRASE1"],
              os.environ["FRASE2"],
              os.environ["FRASE3"]
          ]

          colores = ["0x162033", "0x29354A", "0x59452F"]
          clips = []

          for i, (frase, color) in enumerate(zip(frases, colores)):
              texto = "\n".join(textwrap.wrap(
                  frase, 22, break_long_words=False
              ))

              nombre = f"texto{i}.txt"
              with open(nombre, "w", encoding="utf-8") as f:
                  f.write(texto)

              clip = f"escena{i}.mp4"

              filtro = (
                  "drawtext="
                  "fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:"
                  f"textfile={nombre}:"
                  "fontcolor=white:fontsize=48:"
                  "line_spacing=20:"
                  "x=(w-text_w)/2:y=(h-text_h)/2"
              )

              subprocess.run([
                  "ffmpeg", "-y",
                  "-f", "lavfi",
                  "-i", f"color=c={color}:s=720x1280:r=30:d=10",
                  "-vf", filtro,
                  "-c:v", "libx264",
                  "-preset", "veryfast",
                  "-pix_fmt", "yuv420p",
                  "-t", "10",
                  clip
              ], check=True)

              clips.append(clip)

          with open("lista.txt", "w") as f:
              for clip in clips:
                  f.write(f"file '{clip}'\n")

          subprocess.run([
              "ffmpeg", "-y",
              "-f", "concat",
              "-safe", "0",
              "-i", "lista.txt",
              "-c", "copy",
              "-movflags", "+faststart",
              "reel.mp4"
          ], check=True)
          PY

      - name: Guardar video
        uses: actions/upload-artifact@v4
        with:
          name: reel-generado
          path: reel.mp4
          retention-days: 7
